name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TopLevel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TopLevel-apk
          path: TopLevel.apk

      # Publishes a release so you can download the APK straight from your phone:
      # github.com/<you>/TopLevel/releases/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TopLevel build ${{ github.run_number }}
          make_latest: true
          files: TopLevel.apk
