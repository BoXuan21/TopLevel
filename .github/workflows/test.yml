name: Test & screenshots

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_7, pixel_fold]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app + test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run UI walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.toplevel.app android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.toplevel.app android.permission.READ_CALENDAR || true
            adb shell pm grant com.toplevel.app android.permission.WRITE_CALENDAR || true
            adb shell am instrument -w -r com.toplevel.app.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt || true
            cat instrument.txt | grep -vE "^INSTRUMENTATION_STATUS: (stream|numtests|current|id|class)" | tail -80
            adb exec-out run-as com.toplevel.app tar cf - files/shots > shots.tar || true
            adb logcat -d -t 3000 > logcat.txt || true
            grep -q "^OK (" instrument.txt

      - name: Unpack screenshots
        if: always()
        run: |
          mkdir -p screenshots
          tar xf shots.tar -C screenshots || true
          ls -R screenshots | head -50

      # Screenshots also go to a branch (screenshots-<device>) so they're easy to view on GitHub
      - name: Publish screenshots to branch
        if: always()
        run: |
          mkdir -p pub
          find screenshots -name "*.png" -exec cp {} pub/ \; || true
          cp instrument.txt pub/ 2>/dev/null || true
          cd pub
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots ${{ matrix.device }} · run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:screenshots-${{ matrix.device }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: |
            screenshots/
            instrument.txt
            logcat.txt
